services:
  # -------------------------------------------------------------
  # Backend Express API Service
  # -------------------------------------------------------------
  - type: web
    name: studybuddy-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: DATABASE_URL
        sync: false

  # -------------------------------------------------------------
  # Frontend React Vite Static Site
  # -------------------------------------------------------------
  - type: web
    name: studybuddy-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://studybuddy-backend-fvhc.onrender.com
